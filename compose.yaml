services:
  listener-api:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${LISTENER_API_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-https://hzagaming.github.io}
      LISTENER_DB_PATH: /data/listener.sqlite
      LISTENER_SECURE_COOKIES: "true"
      ENABLE_NETEASE: "true"
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-https://github.com/hzagaming/LIstener}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:?Set BRAVE_SEARCH_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:?Set YOUTUBE_API_KEY}
      AUDIUS_API_KEY: ${AUDIUS_API_KEY:?Set AUDIUS_API_KEY}
    volumes:
      - listener-data:/data

volumes:
  listener-data:
